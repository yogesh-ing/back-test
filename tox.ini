# =============================================================================
# Tox configuration for testing multiple Python versions (Step 24)
# =============================================================================
# Run: pip install tox && tox
# =============================================================================

[tox]
envlist = py39, py310, py311, lint, mypy
isolated_build = True

[testenv]
deps =
    -r requirements.txt
    pytest>=8.0
    pytest-cov>=5.0
    pytest-mock>=3.0
    pandas>=2.0
    numpy>=1.24
    requests>=2.31
    python-dotenv>=1.0
    SQLAlchemy>=2.0
    PyYAML>=6.0
    Flask>=2.0
setenv =
    PYTHONPATH = src
    FORWARD_TEST_DB_URL = sqlite:///:memory:
    FORWARD_TEST_DB_PROFILE = testing
commands =
    # F-18 (ticket #10): the old `-k "not live"` deselected the deterministic
    # live-engine tests (module name contains "live") — the T8/T9 hard gate
    # never ran under tox. Only the opt-in real-venue integration module is
    # excluded now; it is already skipif-gated by RUN_MSTOCK_LIVE_TEST=1.
    pytest tests/ -q -k "not live_integration" --cov=src/backtest --cov-report=term-missing
    pytest tests/ -q -k "not live_integration" --cov=src/backtest --cov-fail-under=80

[testenv:lint]
deps =
    -r requirements.txt
    # Tool versions pinned to the exact revs in .pre-commit-config.yaml —
    # an unpinned tox env drifts to newer tool releases with different
    # formatting rules, and the two gates disagree again (ticket #11, F-10).
    black==24.8.0
    isort==5.13.2
    flake8==7.1.1
    pylint==3.0.3
commands =
    # Args must stay VERBATIM-identical to .pre-commit-config.yaml (no shared
    # config file for black/isort without adding a pyproject.toml, which
    # would change tox's isolated_build behaviour — not worth the risk here).
    # flake8 carries no flags: .flake8 is the single authority (ticket #11).
    black --check --line-length=100 src/ tests/
    isort --check --profile=black --line-length=100 src/ tests/
    flake8 src/
    pylint src/backtest/simulator --disable=all --enable=E,F --max-line-length=100

[testenv:mypy]
deps =
    mypy
    -r requirements.txt
commands =
    mypy src/backtest --ignore-missing-imports --no-strict-optional

[testenv:benchmark]
deps =
    {[testenv]deps}
    pytest-benchmark
commands =
    pytest benchmarks/ -q --benchmark-only
