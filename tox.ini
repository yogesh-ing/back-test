# =============================================================================
# Tox configuration for testing multiple Python versions (Step 24)
# =============================================================================
# Run: pip install tox && tox
# =============================================================================

[tox]
envlist = py39, py310, py311, lint, mypy
isolated_build = True

[testenv]
deps =
    -r requirements.txt
    pytest>=8.0
    pytest-cov>=5.0
    pytest-mock>=3.0
    pandas>=2.0
    numpy>=1.24
    requests>=2.31
    python-dotenv>=1.0
    SQLAlchemy>=2.0
    PyYAML>=6.0
    Flask>=2.0
setenv =
    PYTHONPATH = src
    FORWARD_TEST_DB_URL = sqlite:///:memory:
    FORWARD_TEST_DB_PROFILE = testing
commands =
    pytest tests/ -q -k "not live" --cov=src/backtest --cov-report=term-missing
    pytest tests/ -q -k "not live" --cov=src/backtest --cov-fail-under=80

[testenv:lint]
deps =
    black
    isort
    flake8
    pylint
commands =
    black --check src/ tests/
    isort --check src/ tests/
    flake8 src/ --max-line-length=100 --exclude=__pycache__
    pylint src/backtest/simulator --disable=all --enable=E,F --max-line-length=100

[testenv:mypy]
deps =
    mypy
    -r requirements.txt
commands =
    mypy src/backtest --ignore-missing-imports --no-strict-optional

[testenv:benchmark]
deps =
    {[testenv]deps}
    pytest-benchmark
commands =
    pytest benchmarks/ -q --benchmark-only
