# Alembic configuration for the forward testing simulator.
#
# The database URL is NOT stored here. It is read at runtime from the
# FORWARD_TEST_DB_URL environment variable (see db/alembic/env.py) so that
# credentials never land in version control.
#
# Usage:
#   export FORWARD_TEST_DB_URL=postgresql+psycopg2://user:pass@localhost:5432/forward_test
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current
#   alembic history --verbose

[alembic]
script_location = db/alembic
prepend_sys_path = src
version_path_separator = os

# Timestamped, slugged revision filenames: 20260819_1430_a1b2c3_add_x.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Left blank on purpose — env.py injects it from the environment.
sqlalchemy.url =


[post_write_hooks]
# Uncomment to auto-format generated migrations.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
